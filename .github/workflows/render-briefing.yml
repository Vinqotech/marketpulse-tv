name: Render MarketPulse TV briefing
on:
  repository_dispatch:
    types: [render-briefing]
permissions:
  contents: read
concurrency:
  group: marketpulse-${{ github.event.client_payload.episode_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install renderer
        run: cp renderer/package.json package.json && npm install --no-audit --no-fund
      - name: Install CPU narration
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro==0.9.4 soundfile numpy transformers==4.57.1 accelerate sentencepiece
      - name: Verify required Python editor and narration packages
        run: |
          python3 -u - <<'PY'
          import importlib
          import sys
          import traceback
          for package in ('torch', 'transformers', 'accelerate', 'sentencepiece', 'kokoro', 'soundfile', 'numpy'):
              try:
                  importlib.import_module(package)
                  print(f'[dependencies] {package}: available', flush=True)
              except Exception as error:
                  print(f'[dependencies] {package}: {type(error).__name__}: {error}', file=sys.stderr, flush=True)
                  traceback.print_exc(file=sys.stderr)
                  sys.stderr.flush()
                  sys.exit(1)
          PY
      - name: Render and upload briefing
        run: node scripts/render-briefing.mjs
